services:

  # ── 1. Ollama ─────────────────────────────────────────────────────────────
  # Runs the vision model (ingredient detection), llama3.2 (RAG LLM), and embeddings.
  # Pull models on first start — the HTTP API does not auto-pull, so the tag
  # here must match LLM_MODEL_OLLAMA / DETECTOR_VLM_MODEL exactly:
  #   docker exec -it nutriai-ollama ollama pull qwen2.5vl:7b
  #   docker exec -it nutriai-ollama ollama pull llama3.2:3b
  ollama:
    image: ollama/ollama:latest
    container_name: nutriai-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    # Add this section to enable GPU support
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1 # Number of GPUs to use, or use 'all'
    #           capabilities: [gpu]
    # restart: unless-stopped

  # ── 2. Main API ───────────────────────────────────────────────────────────
  # FastAPI application — src/ package. Calls ollama for LLM + vision.
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nutriai-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Service URLs — use container names (Docker internal DNS)
      - OLLAMA_BASE_URL=http://ollama:11434/
      # Point DB to the persistent volume
      - DB_PATH=/app/db/users.db
      # Upload directory for images
      - UPLOAD_DIR=/app/uploads
    volumes:
      # Data directories (read-only)
      - ./data:/app/data:ro
      - ./data_test:/app/data_test:ro
      - ./vector_databases:/app/vector_databases:ro
      # Persistent database — bind mount so DBeaver can open ./db/users.db directly
      - ./db:/app/db
      # Upload directory — images uploaded via Flutter are saved here
      - ./uploads:/app/uploads
    depends_on:
      - ollama
    restart: unless-stopped

volumes:
  # Ollama model weights (downloaded once, persisted across restarts)
  ollama_data:
