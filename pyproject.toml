[project]
name = "nutrition-ai-assistant"
version = "0.2.0"
description = "Personalized nutrition and recipe recommendation API powered by LLM, RAG, and computer vision."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }

dependencies = [
    # ── Core API ──
    "fastapi==0.109.0",
    "uvicorn[standard]==0.27.0",
    "pydantic>=2.7.4,<3.0.0",
    "python-multipart>=0.0.9",
    "python-dotenv==1.0.1",
    # ── Auth ──
    "bcrypt==3.2.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    # ── Database ──
    "aiosqlite==0.22.1",
    "aiofiles==22.1.0",
    # ── LangChain & RAG (1.x) ──
    "langchain>=1.3,<2",
    "langchain-core>=1.4,<2",
    "langgraph>=1.2,<2",
    "langchain-community>=0.4,<0.5",
    "langchain-text-splitters>=1.1,<2",
    "langchain-huggingface>=1.2,<2",
    "langchain-ollama>=1.1,<2",
    "langchain-groq>=1.1,<2",
    "langchain-openai>=1.3,<2",
    # ── LLM / Embeddings ──
    "ollama>=0.3.0",
    "transformers>=4.40.0",
    "sentence-transformers==3.3.1",
    # torch>=2.6 required by transformers' torch.load CVE guard (CVE-2025-32434);
    # torchvision 0.21.0 is the matching pair for torch 2.6.0.
    # Both resolve from the CPU wheel index — see [tool.uv.sources] below.
    "torch==2.6.0",
    "torchvision==0.21.0",
    # ── Vision (ingredient detection) ──
    "ultralytics>=8.3.0",
    # ── Vector search ──
    "faiss-cpu==1.9.0.post1",
    "rank-bm25==0.2.2",
    # ── Document ingestion ──
    "pypdf==5.1.0",
    # ── HTTP ──
    "requests>=2.32.5",
    # ── Data ──
    "numpy==1.26.4",
    "pandas==2.2.2",
    # ── Utilities ──
    "typing-extensions>=4.14",
    "protobuf==4.25.3",
    "jsonschema==4.23.0",
    "rpds-py==0.19.1",
    "six==1.16.0",
]

[project.scripts]
nutriai-api = "adapters.rest.app:main"
nutriai-index = "adapters.cli.index_cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "mypy>=1.10",
]
# Only needed to retrain the ingredient detector, never to serve it.
# Install with:  uv sync --group training
training = [
    "pyyaml>=6.0",
]

# ---------------------------------------------------------------------------
# Torch comes from PyPI as a CUDA build on linux/x86_64, which drags in ~3.6 GB
# of nvidia-*-cu12 + triton that the API never executes: the LLM runs in the
# Ollama container, faiss is CPU-only, and YOLO inference on a handful of
# uploaded images does not need a GPU. Pin the CPU wheels instead.
#
# To train on a GPU, install torch from the CUDA index in that environment
# only — training is not part of the deployed image:
#   uv pip install torch==2.6.0 torchvision==0.21.0 \
#       --index-url https://download.pytorch.org/whl/cu124
# ---------------------------------------------------------------------------
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchvision = [{ index = "pytorch-cpu" }]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# Flat `src/` layout: src is the import root, so `factory`, `adapters`,
# `infrastructure`, etc. are all importable top-level once installed.
[tool.setuptools]
package-dir = { "" = "src" }
py-modules = ["factory"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    # Nearly every long line is an embedded LLM prompt, where reflowing the
    # string would change what the model actually receives.
    "E501",
    # `param = Depends(...)` in a default argument is the FastAPI idiom.
    "B008",
    # SafetyVerdict(str, Enum) is deliberate — its .value is compared against
    # strings that cross the API boundary.
    "UP042",
]

[tool.ruff.lint.per-file-ignores]
# Operator scripts prepend src/ to sys.path before importing from it.
"scripts/*" = ["E402"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
